[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policyeval"
version = "0.2.2"
description = "LLM-as-a-judge framework for evaluating LLM outputs against policies and rules"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Haggai Shachar", email = "haggai.shachar@backline.ai" }
]
keywords = ["llm", "evaluation", "policy", "rules", "compliance", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "typer>=0.9",
    "rich>=13.0",
    "pyyaml>=6.0",
    "tenacity>=8.0",
]

[project.urls]
Homepage = "https://github.com/Backline-AI/PolicyEval"
Repository = "https://github.com/Backline-AI/PolicyEval"
Issues = "https://github.com/Backline-AI/PolicyEval/issues"

[project.scripts]
policyeval = "policyeval.cli.main:app"

[project.entry-points."pytest11"]
policyeval = "policyeval.testing.plugin"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:harvest -p no:evals"
filterwarnings = [
    "ignore::pytest.PytestDeprecationWarning:pytest_harvest",
    "ignore::pytest.PytestUnknownMarkWarning:pytest_harvest",
]

[tool.coverage.run]
source = ["policyeval"]
branch = true

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "if TYPE_CHECKING:",
]

[tool.hatch.build.targets.wheel]
packages = ["policyeval"]

[tool.hatch.build.targets.sdist]
exclude = [".claude"]
